name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  # No "prefer-lowest" job: jms/serializer ^1.6, the lowest allowed floor, uses
  # "readonly" as an identifier, which PHP 8.1 reserves, so no PHP version
  # satisfies both that floor and the rest of the constraints.
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit

  phpcs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpcs --standard=phpcs.xml.dist src/ tests/
